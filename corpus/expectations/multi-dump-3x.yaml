# Multi-dump: 3 JDK 17 jstacks concatenated in the SAME file (timestamps 10s apart), the same
# threads changing state over time (order-dispatcher: WAITING -> BLOCKED -> BLOCKED).
format: multi-dump
preserved_anchors:
  - "2026-07-24 11:00:00"
  - "2026-07-24 11:00:10"
  - "2026-07-24 11:00:20"
  - "Full thread dump OpenJDK 64-Bit Server VM (17.0.8+7-LTS mixed mode, sharing):"  # 3 occurrences
  - "java.lang.Thread.State:"
allowlisted_threads_verbatim:
  - "Reference Handler"
tokenized_threads:
  "main": {}   # fixed after checking against the real allowlist: the real allowlist-v1 has no rule for "main" -> tokenized
  "pgto-worker-3": { keeps_suffix: "-3" }
  "order-dispatcher": {}
tokenized_classes:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.payment.gateway.AcquirerClient"
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.LedgerLock"
  - "com.acme.payment.PaymentFacade"
  - "com.acme.order.OrderDispatcher"
  - "com.acme.order.OrderService"
stripped_lines:
  - "Threads class SMR info:"
  - "_java_thread_list"
  - "JNI global refs"
invariants:
  - intra_dump_determinism
  - inter_dump_determinism      # "pgto-worker-3" and the classes get the SAME token in all 3 dumps
  - blank_lines_preserved
  - lock_addresses_verbatim
# Traps covered: ThreadMine's timeline correlates threads ACROSS dumps by name - if the token
# varies between the 3 dumps the correlation (and the "BLOCKED for 2 dumps" detection) breaks; the
# address <0x000000061fcc9b80> repeats in all 3 dumps and must stay identical; the multi-dump
# detector splits the dumps on the "Full thread dump" line - it has to survive 3x.
