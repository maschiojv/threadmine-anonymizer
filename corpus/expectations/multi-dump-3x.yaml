# Multi-dump: 3 jstacks JDK 17 concatenados no MESMO arquivo (timestamps 10s apart), mesmas
# threads evoluindo de estado (order-dispatcher: WAITING -> BLOCKED -> BLOCKED).
formato: multi-dump
ancoras_preservadas:
  - "2026-07-24 11:00:00"
  - "2026-07-24 11:00:10"
  - "2026-07-24 11:00:20"
  - "Full thread dump OpenJDK 64-Bit Server VM (17.0.8+7-LTS mixed mode, sharing):"  # 3 ocorrencias
  - "java.lang.Thread.State:"
threads_allowlist_verbatim:
  - "Reference Handler"
threads_tokenizadas:
  "main": {}   # corrigido na onda 2E: a allowlist-v1 real nao tem regra p/ "main" -> tokenizada
  "pgto-worker-3": { preserva_sufixo: "-3" }
  "order-dispatcher": {}
classes_tokenizadas:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.payment.gateway.AcquirerClient"
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.LedgerLock"
  - "com.acme.payment.PaymentFacade"
  - "com.acme.order.OrderDispatcher"
  - "com.acme.order.OrderService"
linhas_stripadas:
  - "Threads class SMR info:"
  - "_java_thread_list"
  - "JNI global refs"
invariantes:
  - determinismo_intra_dump
  - determinismo_inter_dump      # "pgto-worker-3" e as classes recebem o MESMO token nos 3 dumps
  - blank_lines_preservadas
  - enderecos_lock_verbatim
# Armadilhas cobertas: a timeline do ThreadMine correlaciona threads ENTRE dumps pelo nome - se o
# token variar entre os 3 dumps a correlacao (e a deteccao de "BLOCKED ha 2 dumps") quebra; o
# endereco <0x000000061fcc9b80> repete nos 3 dumps e deve continuar identico; o detector de
# multi-dump separa os dumps pela linha "Full thread dump" - ela precisa sobreviver 3x.
