# Classic IBM JDK javacore (J2RE 1.4.2 style, like ThreadMine's real-openj9.txt):
# NO 1XMJAVAVERSION (the version lives only in 1CIJAVAVERSION; the 5-B.2 amendment re-emits
# the payload right after the CI strip marker, under the 1XMJAVAVERSION token — the only one
# the OpenJ9 parser reads — so ThreadMine does not parse the masked file with versaoJava=null),
# threads with state:R/CW/B and TID/sys_thread_t/native ID on the 3XMTHREADINFO line itself,
# XM section delimited by tokens (there is no blank line between threads — SPEC 5-B.7).
# Schema §6 extended for javacore: + detection_anchors_4kb, preserved_sections,
# stripped_sections, redacted_lines, native_ids_verbatim.
format: openj9-javacore
detection_anchors_4kb:
  # SPEC 5-B.1: at least ONE of the detection tokens (1TISIGINFO | 3XMTHREADINFO | 1XMJAVAVERSION)
  # must survive WITHIN the first 4KB of the masked file. In this fixture 1TISIGINFO
  # (line 4) survives, and the 5-B.2 amendment puts a synthetic 1XMJAVAVERSION right after the
  # CI strip — well inside the 4KB, since the strip collapses everything that came before.
  - "1TISIGINFO"
  - "1XMJAVAVERSION"
preserved_sections:
  - "TITLE"            # minimal: 1TISIGINFO + 1TIDATETIME preserved; 1TIFILENAME redacted (5-B.3)
  - "XM"
stripped_sections:      # each collapses into ONE line "# [tm-anon: stripped section <NAME>]" (5-B.2)
  - "XHPI"             # not in the fixed 5-B.2 list -> stripped by the unknown-section fail-closed (5-B.6)
  - "CI"               # 1CICMDLINE with -Dacme.db.password/host, 1CISYSCP, -Djava.class.path with the product jars
  - "DC"
  - "DG"
  - "ST"
  - "XE"
  - "LK"               # com.acme.* class@address monitors + thread names in 3LKWAITNOTIFY/3LKWAITER
  - "CL"               # com/acme/kernel/AcmeModuleClassLoader classloader + 3CLTEXTCLASS with the app classes
  - "Javadump End section"   # unknown trailing 0SECTION -> same fail-closed as 5-B.6
redacted_lines:
  - "1TIFILENAME"      # local path D:\acme\payserver\... (hostname/user/dir layout) — ALWAYS redacted
preserved_anchors:
  - "1TISIGINFO     signal 3 received"
  - "1TIDATETIME    Date:                 2007/03/14 at 09:30:11"
  - "J2RE 1.4.2 IBM Windows 32 build cn142sr2w-20050810"   # 1CIJAVAVERSION payload: re-emitted
                       # verbatim under 1XMJAVAVERSION (5-B.2 amendment) — public IBM GA version/vendor/build,
                       # nothing customer-identifiable (audited); also repeated in 2XMFULLTHDDUMP
  - "1XMCURTHDINFO"
  - "2XMFULLTHDDUMP"   # "Full thread dump Classic VM (...)": structural to XM; contains the phrase
                       # "Full thread dump" WELL beyond 4KB — must not be reclassified as HotSpot
  - "3XMTHREADINFO"
  - "4XESTACKTRACE"
allowlisted_threads_verbatim:
  - "Signal dispatcher"    # allowlist-v1 regex (?i)^(VM |Signal |Finalizer|Reference Handler|Attach Listener)
  - "Finalizer"
  - "Reference Handler"
  - "Thread-1"             # ^Thread-\d+$
tokenized_threads:
  # Classic pool names "X: 'N' for queue: 'Q'" do NOT match the [-#]N suffix heuristic of
  # SPEC 5.3c (the number sits in the middle, in single quotes) -> rule 5.3d: token for the whole
  # name, a DIFFERENT token per thread. Loses pool grouping — limitation recorded in the INDEX.
  "QueueWorker: '0' for queue: 'acme.kernel.Default'": {}
  "QueueWorker: '1' for queue: 'acme.kernel.Default'": {}
  "QueueWorker: '2' for queue: 'acme.kernel.Default'": {}
  "QueueWorker: '3' for queue: 'acme.kernel.Default'": {}
  "QueueWorker: '4' for queue: 'acme.kernel.Default'": {}
  "QueueWorker: '0' for queue: 'acme.kernel.System'": {}
  "ListenThread.Default": {}
  "com.acme.health.CoreHealthMonitor": {}   # thread name that IS an FQCN -> thread token (t...), not a class token
  "main": {}                                # allowlist-v1 has no rule for "main" (same decision as the HotSpot fixtures)
tokenized_classes:
  # In XM the frames are dotted FQCNs (classic dialect) — same SPEC 5.1 rules.
  - "com.acme.kernel.QueueWorker"
  - "com.acme.ledger.LedgerCache"
  - "com.acme.gateway.CardSwitchClient"
  - "com.acme.pay.PaymentRouter"
  - "com.acme.server.AcmeServerSocket"
  - "com.acme.server.ListenThread"
  - "com.acme.server.PayServer"
  - "com.acme.health.CoreHealthMonitorThread"
native_ids_verbatim: true   # TID:0x... / sys_thread_t:0x... / native ID:0x... on 3XMTHREADINFO (5-B.4)
invariants:
  - intra_dump_determinism
  - native_ids_verbatim
  - threadinfo_stacktrace_order_preserved    # 5-B.7: relative 3XMTHREADINFO/4XESTACKTRACE order intact
  - compiled_code_moulding_preserved          # 5.1: "(Compiled Code)" glued to the source file, with NO line
                       # number (1.4.2 dialect) — the moulding survives verbatim (the ThreadMine parser
                       # reads it as a "JIT-compiled frame") and only the file name becomes a token
  - verify_exit4_if_forbidden_section_survives  # 5-B.9: CI/LK/CL/DC/DG/ST/XE alive in the masked file = exit 4
  - verify_exit4_if_1tifilename_has_content  # 5-B.9
# Traps covered: (1) 1TISIGINFO is the ONLY detection anchor within 4KB — the TITLE strip must
# not touch it; (2) a thread with no stack ("Signal dispatcher": 3XMTHREADINFO followed by
# another 3XMTHREADINFO, no 4XESTACKTRACE) must not break the lexer; (3) 2XMFULLTHDDUMP repeats
# the JVM version (non-sensitive, preserve it); (4) the same thread name appears in XM
# (preserved/tokenized) and in LK (stripped) — the token only has to exist in XM; (5) JIT frames
# in the 1.4.2 dialect carry "(Compiled Code)" glued to the source file with NO line number —
# "(Object.java(Compiled Code))" on an allowlisted class and "(LedgerCache.java(Compiled Code))"
# on an app class. This shape (unlike the modern fixture's "(File.java:NN(Compiled Code))") is
# what verify used to treat as a residual identifier: a false positive on a real javacore, exit 4
# on a properly masked file.
