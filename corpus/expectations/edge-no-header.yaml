# Edge: dump WITHOUT the "Full thread dump" line (snippet pasted from a log, minimal headers with
# no os_prio/cpu/elapsed). The ThreadMine parser accepts this format (the
# real-hotspot-deadlock.txt fixture looks like this) - so tm-anon must accept it TOO: the
# "Full thread dump" anchor is SUFFICIENT but not NECESSARY; a thread header `"name" #N prio=`
# also identifies hotspot-jstack. Rejecting here would block valid uploads (fail-closed is for
# UNKNOWN formats, not for a partial jstack).
format: hotspot-jstack
preserved_anchors:
  - "java.lang.Thread.State:"
allowlisted_threads_verbatim:
  - "http-nio-8080-exec-1"
tokenized_threads:
  "pgto-worker-1": { keeps_suffix: "-1" }
  "pgto-worker-2": { keeps_suffix: "-2" }
tokenized_classes:
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.LedgerLock"
  - "com.acme.payment.PaymentFacade"
  - "com.acme.stock.StockLatch"
  - "com.acme.stock.StockSync"
  - "com.acme.order.OrderService"
  - "com.acme.web.PaymentController"
stripped_lines: []
invariants:
  - accepts_without_full_thread_dump_header
  - intra_dump_determinism
  - blank_lines_preserved
  - lock_addresses_verbatim
# Pitfall covered: a minimal header (`"pgto-worker-1" #31 prio=5 tid=0x1000 nid=0x1000
# waiting for monitor entry`, no bracketed stack range) has to be recognized as a
# thread header; the first output line ("# tm-anon v1") ends up being the only thing before the
# first header.
