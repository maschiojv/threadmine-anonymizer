# Edge: lambdas ($$Lambda$123/0x... in the JDK 15-20 style and $$Lambda/0x... in the JDK 21+ one),
# inner classes (Foo$Bar, Foo$Bar$1), lambda$met$0, CGLIB proxies
# ($$EnhancerBySpringCGLIB$$/$$FastClassBySpringCGLIB$$ plus the (<generated>) frame),
# <init>/<clinit>, LambdaForm$MH.
format: hotspot-jstack
preserved_anchors:
  - "Full thread dump OpenJDK 64-Bit Server VM (17.0.8+7-LTS mixed mode, sharing):"
  - "java.lang.Thread.State:"
allowlisted_threads_verbatim:
  - "http-nio-8080-exec-3"
  - "VM Thread"
tokenized_threads:
  "order-async-1": { keeps_suffix: "-1" }
  "stock-init-1": { keeps_suffix: "-1" }
tokenized_classes:
  - "com.acme.order.OrderService"      # in lambda$processOrder$0: the inner method becomes lambda$<m...>$0
  - "com.acme.stock.StockSync"         # StockSync$Watcher -> C...$C...; StockSync$Watcher$1 the same, with the anonymous $1
  - "com.acme.web.OrderController"     # $$EnhancerBySpringCGLIB$$aa11bb22: base class tokenized, CGLIB moulding + hash preserved
  - "com.acme.stock.StockCatalog"
  - "com.acme.stock.StockBootstrap"
stripped_lines:
  - "JNI global refs"
invariants:
  - intra_dump_determinism
  - blank_lines_preserved
# Traps covered (SPEC 5.2): `OrderService$$Lambda$123/0x00007f8a1c2b3c40.run(Unknown Source)`
# keeps the $$Lambda$123/0x... moulding intact (the hex is a generated-class address, not a
# secret) and tokenizes the base class alone; `StockBootstrap$$Lambda/0x...` (no $N) likewise;
# `lambda$processOrder$0` becomes `lambda$<m...>$0`, preserving lambda$ and $0; `<init>`/`<clinit>`
# verbatim; CGLIB's `(<generated>)` frame preserved (there is no .java file); org.springframework.*
# frames are recommended tier: verbatim by default, tokenized under --strict;
# LambdaForm$MH/0x... and java.lang.invoke -> allowlisted, verbatim.
