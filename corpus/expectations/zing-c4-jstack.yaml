# Azul Zing (Prime): corpo identico ao HotSpot -- o proprio ParserZingImpl do ThreadMine
# delega ao ParserHotSpotCore -- mais o bloco de metadados "Zing thread dump header:" e as
# threads do coletor C4. Fixture da onda 5 (debito "dialetos nao-HotSpot" da SPEC 6).
formato: hotspot-jstack
ancoras_preservadas:
  - "Full thread dump Zing (21.09.0.0-8-ZVM mixed mode):"
  - "java.lang.Thread.State:"
threads_allowlist_verbatim:
  - "http-nio-8080-exec-1"
  - "Reference Handler"
  - "C4 Collector Thread"      # regex (?i)^(GC |G1 |C4 |ZGC |...) da allowlist
  - "C4 New Collector"
  - "C4 Old Collector"
  - "VM Thread"
  - "VM Periodic Task Thread"
threads_tokenizadas:
  "main": {}   # a allowlist-v1 real nao tem regra p/ "main" -> tokenizada (mesma decisao da onda 2E)
  "pgto-worker-1": { preserva_sufixo: "-1" }
  "pgto-worker-2": { preserva_sufixo: "-2" }
classes_tokenizadas:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.LedgerLock"      # tambem apos "(a " nas linhas de lock
  - "com.acme.payment.PaymentFacade"
  - "com.acme.payment.gateway.AcquirerClient"
linhas_stripadas:
  - "Zing thread dump header:"   # bloco de metadados: nenhum parser do ThreadMine o le
  - "Zing runtime version"
  - "JNI global refs"
invariantes:
  - determinismo_intra_dump
  - blank_lines_preservadas
  - enderecos_lock_verbatim
  - sufixo_numerico_preservado
# Armadilhas cobertas: o banner "Full thread dump Zing" e a ancora que o
# DetectorFormatoServiceImpl usa para rotear ao ParserZingImpl -- reescreve-lo quebraria a
# deteccao de formato no servidor; as threads C4 sao infra publica da Azul e ficam verbatim
# (ja cobertas pela allowlist v1), entao o agrupamento de GC sobrevive.
