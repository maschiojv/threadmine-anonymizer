# jcmd <pid> Thread.dump_to_file -format=text on JDK 24+ (jdk.internal.vm.ThreadDumper):
#   writer.println("#" + threadId + " \"" + name + "\" " + (isVirtual ? "virtual " : "")
#                  + state + " " + Instant.now());
#   writer.print("    at "); writer.println(stackTraceElement);
#   writer.println("    - locked " + decorateObject(o));      // decorateObject = "<" + Objects.toIdentityString(obj) + ">"
#   writer.println("    - lock is eliminated");
#   writer.println("    - parking to wait for " + decorateObject(parkBlocker) + ", owner #N");
# Two hard differences from jstack: `virtual ` comes BEFORE the state (lowercase) and the
# monitor inside <> is NOT an address, it is FQCN@identityHash — that is, the application class
# name lives inside the <>. Preserving the contents of <> verbatim (correct for an address)
# would leak the class; that is why the contents are classified first (SPEC 5.4/5.8).
format: hotspot-jcmd-text
preserved_anchors:
  - "41215"
  - "2026-07-24T13:44:02.113921Z"
  - "25.0.1+9-LTS"
  - "2026-07-24T13:44:02.114003Z"
  - "TIMED_WAITING"
  - " virtual WAITING "
  - " virtual RUNNABLE "
  - "- lock is eliminated"
  - ", owner #30"
  - "@6e8cf4c6>"
  - "- locked <java.util.concurrent.ThreadPoolExecutor$Worker@1a2b3c4d>"
  - "- parking to wait for <java.util.concurrent.locks.ReentrantLock$NonfairSync@5e8f9a3b>"
allowlisted_threads_verbatim:
  - "ForkJoinPool-1-worker-1"
tokenized_threads:
  "main": {}
  "pgto-worker-1": { keeps_suffix: "-1" }
  "pgto-worker-2": { keeps_suffix: "-2" }
  "pgto-worker-3": { keeps_suffix: "-3" }
  "order-dispatcher": {}
  "sync-/api/orders?tenant=99887766": { route_marker: true }
tokenized_classes:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.LedgerLock"
  - "com.acme.payment.PaymentFacade"
  - "com.acme.payment.gateway.AcquirerClient"
  - "com.acme.order.queue.OrderQueue"
  - "com.acme.order.queue.EventConsumer"
  - "com.acme.order.OrderDispatcher"
stripped_lines: []
invariants:
  - intra_dump_determinism
  - inter_dump_determinism
  - blank_lines_preserved
  - numeric_suffix_preserved
  - route_marker_q
# Traps covered: `<com.acme.payment.LedgerLock@6e8cf4c6>` has to become a tokenized
# class + verbatim @hash (the same token as the class cited in a frame), while
# `<java.util.concurrent...@hash>` stays intact by allowlist; the `, owner #30` trailer
# survives but any other trailer drops the line via fail-closed; `- lock is
# eliminated` has no identifier and is structure; frames here use `at ` with 4 spaces
# (the JDK 21 dialect uses 6 spaces and no `at `).
