# Edge: "waiting to re-lock in wait()" (thread BLOCKED coming out of Object.wait), the
# "<no object reference available>" sentinel, "Compiling:" lines naming com.acme.* classes on the
# CompilerThread, "process reaper (pid 4242)".
format: hotspot-jstack
preserved_anchors:
  - "Full thread dump OpenJDK 64-Bit Server VM (11.0.16+8-LTS mixed mode):"
  - "java.lang.Thread.State:"
  - "waiting to re-lock in wait()"
  - "<no object reference available>"   # sentinel verbatim (SPEC 5.4)
allowlisted_threads_verbatim:
  - "C2 CompilerThread0"
  - "C1 CompilerThread0"
  - "VM Thread"
  - "GC Thread#0"
  - "VM Periodic Task Thread"
tokenized_threads:
  "main": {}   # fixed after checking against the real allowlist: the real allowlist-v1 has no rule for "main" -> tokenized
  "process reaper (pid 4242)": {}   # fixed after checking against the real allowlist: allowlist-v1 has no "process reaper" prefix
  "order-consumer-1": { keeps_suffix: "-1" }
  "order-consumer-2": { keeps_suffix: "-2" }
  "gc-notifier-1": { keeps_suffix: "-1" }   # starts with lowercase "gc-": NOT the "GC " infra prefix - tokenized
tokenized_classes:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.order.queue.OrderQueue"   # shows up in the "(a ...)" of the re-lock line
  - "com.acme.order.OrderConsumer"
  - "com.acme.core.util.GcNotifier"
stripped_lines:
  - "Threads class SMR info:"
  - "_java_thread_list"
  - "Compiling:"     # BOTH Compiling lines (with and without the OSR %) - they name com.acme, stripping is mandatory
  - "JNI global refs"
invariants:
  - intra_dump_determinism
  - blank_lines_preserved
  - lock_addresses_verbatim
# Pitfalls covered: "- waiting to re-lock in wait() <0x...> (a com.acme...)" - the moulding and the
# address stay verbatim, only the class after "(a " is tokenized; the line "Compiling: 9017 %     3
# com.acme.billing.InvoiceService::computeTotals @ 24 (188 bytes)" carries an FQCN::method outside
# the frame format - stripping it is safer (and cheaper) than tokenizing; "gc-notifier-1" proves
# that prefix allowlist matching is case/word-sensitive ("GC " != "gc-"); process reaper
# with a custom pid 4242 stays verbatim (allowlisted prefix, a pid is not a business identifier).
