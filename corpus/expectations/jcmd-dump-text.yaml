# jcmd <pid> Thread.dump_to_file -format=text (JEP 425+): 3-line header (pid,
# ISO timestamp, version), threads as `#N "name" STATE`, frames indented with 6 spaces and a
# `java.base/` module prefix (slash, NOT at-sign), VTs as `#N "" VIRTUAL STATE`.
format: hotspot-jcmd-text
preserved_anchors:
  - "48350"
  - "2026-07-24T13:02:19.482190Z"
  - "21.0.3+9-LTS"
  - "VIRTUAL"
allowlisted_threads_verbatim:
  - "Reference Handler"
  - "Finalizer"
  - "ForkJoinPool-1-worker-1"
tokenized_threads:
  "main": {}   # fixed after checking against the real allowlist: the real allowlist-v1 has no rule for "main" -> tokenized
  "pgto-worker-1": { keeps_suffix: "-1" }
  "pgto-worker-2": { keeps_suffix: "-2" }
  "order-vt-9": { keeps_suffix: "-9" }
tokenized_classes:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.PaymentFacade"
  - "com.acme.payment.gateway.AcquirerClient"
  - "com.acme.order.queue.EventConsumer"
stripped_lines: []
invariants:
  - intra_dump_determinism
  - blank_lines_preserved
# Traps covered: frames with NO "at " and NO module on app frames (only java.base/ on the
# JDK ones) - the frame lexer cannot require the "at " prefix; `#52 ""` (anonymous VT) preserved;
# the number after # is the thread TID (not sequential) - verbatim; quoted names tokenized
# with the SAME assignments as the other dialects (same canonical form => same token).
