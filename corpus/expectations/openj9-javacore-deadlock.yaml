# Deadlock in a modern OpenJ9 javacore: 1LKDEADLOCK/2LKDEADLOCKTHR/3LKDEADLOCKWTR/
# 4LKDEADLOCKMON/4LKDEADLOCKOBJ/3LKDEADLOCKOWN block INSIDE the LOCKS section + the monitors
# involved (3LKMONOBJECT/3LKWAITERQ/3LKWAITER) + the two state:B threads with crossed 3XMTHREADBLOCK.
# CORE POINT OF THIS FIXTURE: per SPEC 5-B.2 the LOCKS section (LK family) is stripped IN FULL —
# the "Deadlock detected !!!" banner dies with it. The only deadlock evidence that survives the
# mask is the two 3XMTHREADBLOCK in a cycle ("pgto-worker-1" blocked on X owned by "pgto-worker-2"
# and vice versa) — and it is on THOSE that the server's detection parity has to stand.
format: openj9-javacore
detection_anchors_4kb:
  - "1TISIGINFO"
preserved_sections:
  - "TITLE"
  - "THREADS"
stripped_sections:
  - "GPINFO"
  - "ENVINFO"
  - "MEMINFO"
  - "LOCKS"              # includes 1LKDEADLOCK and the WHOLE 2LKDEADLOCKTHR/4LKDEADLOCKOBJ block — full
                         # strip (5-B.2); no deadlock token may show up in the masked file
  - "Javadump End section"
redacted_lines:
  - "1TIFILENAME"
preserved_anchors:
  - "1TISIGINFO     Dump Event \"user\" (00004000) received"
  - "1TIDATETIME    Date: 2026/02/11 at 14:02:47:918 (UTC)"
  - "1XMJAVAVERSION JRE 17 Linux amd64-64 build 17.0.9+9 (openj9-0.41.0)"
  - "3XMTHREADINFO"
  - "3XMTHREADBLOCK     Blocked on:"
  - "3XMTHREADINFO3           Java.lang.Thread.State: BLOCKED"
  - "4XESTACKTRACE"
allowlisted_threads_verbatim:
  - "Signal Dispatcher"
  - "Finalizer thread"
tokenized_threads:
  "main": {}
  "pgto-worker-1": { keeps_suffix: "-1" }
  "pgto-worker-2": { keeps_suffix: "-2" }
  "pgto-worker-3": { keeps_suffix: "-3" }
tokenized_classes:
  - "com.acme.boot.Application"
  - "com.acme.payment.WalletService"   # worker-1's Blocked on target (5-B.5: class tokenized, @address verbatim)
  - "com.acme.ledger.LedgerBook"       # worker-2's Blocked on target
  - "com.acme.payment.PaymentWorker"
  - "com.acme.payment.PaymentQueue"
native_ids_verbatim: true
invariants:
  - intra_dump_determinism
  - native_ids_verbatim
  - numeric_suffix_preserved
  - threadinfo_stacktrace_order_preserved
  - slash_frames_tokenized
  - blocked_on_consistent             # the cycle must stay CLOSED after the mask:
                                       # token("pgto-worker-1") in worker-2's Owned by == the token in
                                       # worker-1's header (and vice versa); both target classes carry
                                       # the SAME tokens in the frame and in Blocked on
  - deadlock_names_consistent        # same semantics as the HotSpot fixture, applied to 3XMTHREADBLOCK
  - verify_exit4_if_forbidden_section_survives   # in particular: NO *LKDEADLOCK* line in the masked file
  - verify_exit4_if_1tifilename_has_content
# Traps covered: (1) the WalletService/LedgerBook pair appears in THREE contexts (slash frame,
# 3XMTHREADBLOCK, and the stripped LOCKS) — the first two need the SAME token, the third must
# not exist in the output; (2) the Blocked on address (0x00000000E00A2C48) differs from the
# LOCKS @addr1/addr2 pair — addresses are verbatim where preserved, never "fixed"; (3) stripping
# LOCKS removes the ONLY explicit deadlock declaration: recorded as an accepted cost of 5-B
# (ThreadMine's OpenJ9 parser ignores LK; detection comes from the crossed B states) — if javacore
# support ever wants parity with the textual deadlock detector, the SPEC has to change, not the corpus.
