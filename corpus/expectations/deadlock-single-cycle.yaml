# Single-cycle deadlock (2 custom threads, com.acme.* lock classes): full block
# "Found one Java-level deadlock:" + "===" + "Java stack information" + "Found 1 deadlock."
format: hotspot-jstack
preserved_anchors:
  - "Full thread dump OpenJDK 64-Bit Server VM (17.0.8+7-LTS mixed mode, sharing):"
  - "java.lang.Thread.State:"
  - "Found one Java-level deadlock:"
  - "============================="
  - "Java stack information for the threads listed above:"
  - "==================================================="
  - "Found 1 deadlock."
allowlisted_threads_verbatim:
  - "Reference Handler"
  - "Finalizer"
  - "Attach Listener"
  - "VM Thread"
  - "GC Thread#0"
  - "VM Periodic Task Thread"
tokenized_threads:
  "main": {}   # fixed after checking against the real allowlist: the real allowlist-v1 has no rule for "main" -> tokenized
  "pgto-worker-1": { keeps_suffix: "-1" }
  "pgto-worker-2": { keeps_suffix: "-2" }
tokenized_classes:
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.LedgerLock"     # shows up in a frame, in "(a ...)", and in the block's "(object 0x..., a ...)"
  - "com.acme.payment.PaymentFacade"
  - "com.acme.stock.StockLatch"
  - "com.acme.stock.StockSync"
  - "com.acme.order.OrderService"
  - "com.acme.gateway.Bootstrap"
stripped_lines:
  - "Threads class SMR info:"
  - "_java_thread_list"
  - "JNI global refs"
invariants:
  - intra_dump_determinism
  - deadlock_names_consistent   # "pgto-worker-1" in the block = SAME token as the thread header
  - blank_lines_preserved
  - lock_addresses_verbatim       # monitor 0x..., object 0x..., <0x...> untouched
# Pitfalls covered: the quoted names inside the deadlock block (incl. `which is held by
# "pgto-worker-1"`) rewritten with the same token (+ suffix) as the headers; the class in
# `(object 0x000000061fcc9b90, a com.acme.stock.StockLatch)` tokenized while preserving the
# `(object ..., a ...)` moulding; "===" lines byte for byte.
