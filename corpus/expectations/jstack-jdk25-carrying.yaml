# jstack/jcmd Thread.print from JDK 21+ with MOUNTED virtual threads: the carrier prints
# `Carrying virtual thread #N` INSTEAD OF the `java.lang.Thread.State:` line (HotSpot only
# prints one of the two), and the mounted VT block carries the marker
# `<virtual thread is mounted on carrier thread "...">`. The number after `#` is the VT's
# threadId, not a name — nothing to tokenize, everything to preserve: the ThreadMine HotSpot
# parser reads the line (CARRYING_VIRTUAL) and allowlist v1 lists it as a structuralMarker.
# Also exercises the JDK 21+ header shape with `#N [nid]` in brackets and no nid=.
format: hotspot-vt
preserved_anchors:
  - "Full thread dump"
  - "java.lang.Thread.State:"
  - "Carrying virtual thread #32"
  - "Carrying virtual thread #35"
  - "<pinned: synchronized>"
  - "<virtual thread is mounted on carrier thread \"ForkJoinPool-1-worker-1\">"
  - "<virtual thread is mounted on carrier thread \"ForkJoinPool-1-worker-2\">"
allowlisted_threads_verbatim:
  - "ForkJoinPool-1-worker-1"
  - "ForkJoinPool-1-worker-2"
  - "ForkJoinPool-1-worker-3"
  - "VirtualThread-unblocker"
  - "Reference Handler"
tokenized_threads:
  "main": {}
  "pedido-vt-7": { keeps_suffix: "-7" }
tokenized_classes:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.order.OrderService"
  - "com.acme.order.handler.OrderHandler"
  - "com.acme.stock.StockSync"
  - "com.acme.stock.StockLatch"
stripped_lines:
  - "JNI global refs"
invariants:
  - intra_dump_determinism
  - blank_lines_preserved
  - lock_addresses_verbatim
  - line_order_preserved
  - numeric_suffix_preserved
# Pitfalls covered: a thread block with NO state line (the mounted carrier) must not
# crash the lexer or turn into `redacted`; the carrier name inside the Loom marker gets the
# SAME treatment as the header (here: allowlisted, so verbatim on both ends); the anonymous
# VT `"" #32 virtual` has nothing to tokenize; `#N [nid]` (brackets, no nid=) is the
# JDK 21+ header shape on recent macOS/Linux.
