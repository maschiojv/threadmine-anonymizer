# jstack JDK 25: cabecalho com [nid] apos #N, allocated=/defined_classes=, Object.wait0,
# Thread.runWith, VirtualThread-unblocker, ForkJoinPool-1-delayScheduler, process reaper,
# "No compile task", blocos Locked ownable synchronizers, SMR, JNI refs.
formato: hotspot-jstack
ancoras_preservadas:
  - "Full thread dump OpenJDK 64-Bit Server VM (25+36-LTS mixed mode, sharing):"
  - "java.lang.Thread.State:"
threads_allowlist_verbatim:
  - "Reference Handler"
  - "Finalizer"
  - "Signal Dispatcher"
  - "C2 CompilerThread0"
  - "C1 CompilerThread0"
  - "VirtualThread-unblocker"
  - "ForkJoinPool-1-worker-1"
  - "Attach Listener"
  - "GC Thread#0"
  - "GC Thread#1"
  - "VM Thread"
  - "VM Periodic Task Thread"
  - "G1 Service"
  - "G1 Refine#0"
  - "G1 Conc#0"
  - "G1 Main Marker"
threads_tokenizadas:
  "main": {}   # corrigido na onda 2E: a allowlist-v1 real nao tem regra p/ "main" -> tokenizada
  "ForkJoinPool-1-delayScheduler": {}   # corrigido na onda 2E: regex da allowlist cobre so -worker-N
  "process reaper (pid 4242)": {}   # corrigido na onda 2E: allowlist-v1 nao tem prefixo "process reaper"
  "pgto-worker-4": { preserva_sufixo: "-4" }
classes_tokenizadas:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.payment.gateway.AcquirerClient"
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.LedgerLock"
  - "com.acme.payment.PaymentFacade"
linhas_stripadas:
  - "Threads class SMR info:"
  - "_java_thread_list"
  - "Locked ownable synchronizers:"
  - "No compile task"
  - "JNI global refs"
invariantes:
  - determinismo_intra_dump
  - blank_lines_preservadas
  - enderecos_lock_verbatim
# Armadilhas cobertas: campos novos do 25 (allocated=412M, defined_classes=12, `#31 [27139]`,
# nid decimal sem 0x) preservados verbatim no cabecalho tokenizado - a reescrita do nome nao pode
# tocar o resto da linha; threads de infra sem stack (GC/VM) no rodape sem linha de estado;
# `$$Lambda/0x...` (estilo JDK 21+, sem $N) dentro de frame java.base -> allowlist verbatim.
