# jstack JDK 25: header with [nid] after #N, allocated=/defined_classes=, Object.wait0,
# Thread.runWith, VirtualThread-unblocker, ForkJoinPool-1-delayScheduler, process reaper,
# "No compile task", Locked ownable synchronizers blocks, SMR, JNI refs.
format: hotspot-jstack
preserved_anchors:
  - "Full thread dump OpenJDK 64-Bit Server VM (25+36-LTS mixed mode, sharing):"
  - "java.lang.Thread.State:"
allowlisted_threads_verbatim:
  - "Reference Handler"
  - "Finalizer"
  - "Signal Dispatcher"
  - "C2 CompilerThread0"
  - "C1 CompilerThread0"
  - "VirtualThread-unblocker"
  - "ForkJoinPool-1-worker-1"
  - "Attach Listener"
  - "GC Thread#0"
  - "GC Thread#1"
  - "VM Thread"
  - "VM Periodic Task Thread"
  - "G1 Service"
  - "G1 Refine#0"
  - "G1 Conc#0"
  - "G1 Main Marker"
tokenized_threads:
  "main": {}   # fixed after checking against the real allowlist: the real allowlist-v1 has no rule for "main" -> tokenized
  "ForkJoinPool-1-delayScheduler": {}   # fixed after checking against the real allowlist: the allowlist regex covers only -worker-N
  "process reaper (pid 4242)": {}   # fixed after checking against the real allowlist: allowlist-v1 has no "process reaper" prefix
  "pgto-worker-4": { keeps_suffix: "-4" }
tokenized_classes:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.payment.gateway.AcquirerClient"
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.LedgerLock"
  - "com.acme.payment.PaymentFacade"
stripped_lines:
  - "Threads class SMR info:"
  - "_java_thread_list"
  - "Locked ownable synchronizers:"
  - "No compile task"
  - "JNI global refs"
invariants:
  - intra_dump_determinism
  - blank_lines_preserved
  - lock_addresses_verbatim
# Pitfalls covered: the new JDK 25 fields (allocated=412M, defined_classes=12, `#31 [27139]`,
# decimal nid with no 0x) preserved verbatim in the tokenized header - rewriting the name must not
# touch the rest of the line; stackless infra threads (GC/VM) in the footer with no state line;
# `$$Lambda/0x...` (JDK 21+ style, no $N) inside a java.base frame -> allowlisted verbatim.
