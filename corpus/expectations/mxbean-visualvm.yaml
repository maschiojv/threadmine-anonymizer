# ThreadMXBean/VisualVM: `"name" Id=N STATE on Class@hash owned by "other" Id=M`,
# frames prefixed with app// or java.base@21.0.3/, `-  blocked on` / `-  waiting on` /
# `-  locked` lines with Class@hash, `Number of locked synchronizers = N` block.
format: hotspot-mxbean
preserved_anchors:
  - "Full thread dump Java HotSpot(TM) 64-Bit Server VM (21.0.3+9-LTS mixed mode):"
  - "Id="
allowlisted_threads_verbatim:
  - "Reference Handler"
  - "Finalizer"
  - "http-nio-8080-exec-1"
tokenized_threads:
  "main": {}   # fixed after checking against the real allowlist: the real allowlist-v1 has no rule for "main" -> tokenized
  "pgto-worker-1": { keeps_suffix: "-1" }
  "pgto-worker-2": { keeps_suffix: "-2" }
  "order-dispatcher": {}
tokenized_classes:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.payment.LedgerLock"      # in `on com.acme.payment.LedgerLock@1f2e3d`: class -> C..., @1f2e3d verbatim
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.PaymentFacade"
  - "com.acme.payment.gateway.AcquirerClient"
  - "com.acme.web.PaymentController"
  - "com.acme.order.OrderDispatcher"
stripped_lines: []
invariants:
  - intra_dump_determinism
  - blank_lines_preserved
# Pitfalls covered: `owned by "pgto-worker-2" Id=32` references ANOTHER thread by name - it has
# to get the SAME token as that thread's own header (same consistency as the deadlock block);
# Class@hash shows up 2x with the same hash (blocked/locked) - correlation survives because the
# token is deterministic and the @hash is verbatim; the `app//` classloader prefix preserved before
# the tokenized FQCN; `Number of locked synchronizers` names a java.util.concurrent class
# (allowlisted) - line preserved, not redacted.
