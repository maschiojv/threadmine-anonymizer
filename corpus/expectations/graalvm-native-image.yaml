# GraalVM Native Image: estado INLINE no cabecalho da thread, tid decimal, sem linha
# "java.lang.Thread.State:" separada, e blocos "Heap: { ... }" / "Isolates: { ... }"
# delimitados por chave (o ParserGraalVMImpl do ThreadMine ignora os dois).
# Fixture da onda 5 (debito "dialetos nao-HotSpot" da SPEC 6).
formato: hotspot-jstack
ancoras_preservadas:
  - "Full thread dump GraalVM Native Image 24.1.1 (Java Version 21.0.5+9-LTS):"
threads_allowlist_verbatim:
  - "http-nio-8080-exec-1"
  - "Reference Handler"
  - "VM Thread"
threads_tokenizadas:
  "main": {}   # a allowlist-v1 real nao tem regra p/ "main" -> tokenizada (mesma decisao da onda 2E)
  "pgto-worker-1": { preserva_sufixo: "-1" }
  "pgto-worker-2": { preserva_sufixo: "-2" }
classes_tokenizadas:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.PaymentFacade"
  - "com.acme.payment.gateway.AcquirerClient"
linhas_stripadas:
  - "Heap: {"
  - "Isolates: {"
  - "Young generation"
  - "Image heap"
invariantes:
  - determinismo_intra_dump
  - blank_lines_preservadas
  - sufixo_numerico_preservado
# Armadilhas cobertas: o bloco Isolates lista objetos da image heap por FQCN
# ("Object at 0x...: com.acme.boot.ServiceRegistry") -- e o unico lugar do dump onde uma
# classe da aplicacao aparece FORA de um frame, e a SPEC 5.7 manda stripar a secao inteira;
# a delimitacao por chave (nao por indentacao) exige contar profundidade de chaves, senao o
# "}" final vaza como linha nao classificada.
