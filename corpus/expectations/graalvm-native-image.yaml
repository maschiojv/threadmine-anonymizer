# GraalVM Native Image: state INLINE in the thread header, decimal tid, no separate
# "java.lang.Thread.State:" line, and "Heap: { ... }" / "Isolates: { ... }" blocks
# delimited by braces (the analyzer ignores both).
# Covers the dialect that used to be rejected as unsupported.
format: hotspot-jstack
preserved_anchors:
  - "Full thread dump GraalVM Native Image 24.1.1 (Java Version 21.0.5+9-LTS):"
allowlisted_threads_verbatim:
  - "http-nio-8080-exec-1"
  - "Reference Handler"
  - "VM Thread"
tokenized_threads:
  "main": {}   # the real allowlist-v1 has no rule for "main" -> tokenized (same decision as the other fixtures)
  "pgto-worker-1": { keeps_suffix: "-1" }
  "pgto-worker-2": { keeps_suffix: "-2" }
tokenized_classes:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.PaymentFacade"
  - "com.acme.payment.gateway.AcquirerClient"
stripped_lines:
  - "Heap: {"
  - "Isolates: {"
  - "Young generation"
  - "Image heap"
invariants:
  - intra_dump_determinism
  - blank_lines_preserved
  - numeric_suffix_preserved
# Traps covered: the Isolates block lists image-heap objects by FQCN
# ("Object at 0x...: com.acme.boot.ServiceRegistry") -- it is the only place in the dump where an
# application class shows up OUTSIDE a frame, and SPEC 5.7 requires stripping the whole section;
# brace delimiting (not indentation) means tracking brace depth, otherwise the
# closing "}" leaks as an unclassified line.
