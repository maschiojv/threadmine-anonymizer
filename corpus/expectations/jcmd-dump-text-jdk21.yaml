# jcmd <pid> Thread.dump_to_file -format=text no JDK 21..23 (a forma REAL do GA do Loom):
# jdk.internal.vm.ThreadDumper#dumpThread imprimia
#   ps.format("#%d \"%s\"%s%n", threadId, name, isVirtual ? " virtual" : "")
# ou seja: NENHUM estado no cabecalho, marcador `virtual` minusculo e como SUFIXO, e frames
# indentados com 6 espacos vindos de StackTraceElement.toString() (sem "at ").
# Consequencia: o arquivo inteiro nao tem uma unica linha `java.lang.Thread.State:` — a
# deteccao de formato nao pode depender dela, e o lexer nao pode exigir estado no cabecalho.
formato: hotspot-jcmd-text
ancoras_preservadas:
  - "48350"
  - "2026-07-24T13:02:19.482190Z"
  - "21.0.3+9-LTS"
  - "\" virtual"
threads_allowlist_verbatim:
  - "Reference Handler"
  - "ForkJoinPool-1-worker-1"
threads_tokenizadas:
  "main": {}
  "pgto-worker-1": { preserva_sufixo: "-1" }
  "pgto-worker-2": { preserva_sufixo: "-2" }
  "order-vt-9": { preserva_sufixo: "-9" }
classes_tokenizadas:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.PaymentFacade"
  - "com.acme.payment.gateway.AcquirerClient"
  - "com.acme.order.queue.EventConsumer"
linhas_stripadas: []
invariantes:
  - determinismo_intra_dump
  - determinismo_inter_dump
  - blank_lines_preservadas
  - sufixo_numerico_preservado
# Armadilhas cobertas: cabecalho sem estado (`#1 "main"`) e VT anonima sem estado
# (`#52 "" virtual`) — ambos eram redigidos pelo fail-closed antes da onda 3I; `virtual`
# minusculo (a fixture jcmd-dump-text.txt usa a forma maiuscula, entao as duas convivem);
# os tokens de `pgto-worker-*` e `order-vt-9` sao os MESMOS das outras fixtures sob o mesmo
# vault (canonico identico), que e o que mantem timeline/diff do ThreadMine funcionando.
