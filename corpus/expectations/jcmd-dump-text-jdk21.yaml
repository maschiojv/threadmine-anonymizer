# jcmd <pid> Thread.dump_to_file -format=text on JDK 21..23 (the REAL shape of the Loom GA):
# jdk.internal.vm.ThreadDumper#dumpThread used to print
#   ps.format("#%d \"%s\"%s%n", threadId, name, isVirtual ? " virtual" : "")
# that is: NO state in the header, lowercase `virtual` marker as a SUFFIX, and frames
# indented with 6 spaces coming from StackTraceElement.toString() (no "at ").
# Consequence: the whole file does not have a single `java.lang.Thread.State:` line — format
# detection cannot rely on it, and the lexer cannot require a state in the header.
format: hotspot-jcmd-text
preserved_anchors:
  - "48350"
  - "2026-07-24T13:02:19.482190Z"
  - "21.0.3+9-LTS"
  - "\" virtual"
allowlisted_threads_verbatim:
  - "Reference Handler"
  - "ForkJoinPool-1-worker-1"
tokenized_threads:
  "main": {}
  "pgto-worker-1": { keeps_suffix: "-1" }
  "pgto-worker-2": { keeps_suffix: "-2" }
  "order-vt-9": { keeps_suffix: "-9" }
tokenized_classes:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.PaymentFacade"
  - "com.acme.payment.gateway.AcquirerClient"
  - "com.acme.order.queue.EventConsumer"
stripped_lines: []
invariants:
  - intra_dump_determinism
  - inter_dump_determinism
  - blank_lines_preserved
  - numeric_suffix_preserved
# Traps covered: header with no state (`#1 "main"`) and an anonymous VT with no state
# (`#52 "" virtual`) — both used to be redacted by fail-closed; lowercase
# `virtual` (the jcmd-dump-text.txt fixture uses the uppercase form, so the two coexist);
# the tokens for `pgto-worker-*` and `order-vt-9` are the SAME as in the other fixtures under the
# same vault (identical canonical form), which is what keeps ThreadMine's timeline/diff working.
