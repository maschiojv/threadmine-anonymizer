# jstack JDK 8: no cpu=/elapsed=, no module prefix on frames, "JNI global references:"
# (singular, no weak refs) and a Heap section at the bottom (kill -3 style).
format: hotspot-jstack
preserved_anchors:
  - "Full thread dump Java HotSpot(TM) 64-Bit Server VM (25.362-b09 mixed mode):"
  - "java.lang.Thread.State:"
allowlisted_threads_verbatim:
  - "http-nio-8080-exec-1"
  - "http-nio-8080-exec-2"
  - "DestroyJavaVM"
  - "Service Thread"
  - "C1 CompilerThread2"
  - "C2 CompilerThread0"
  - "Signal Dispatcher"
  - "Finalizer"
  - "Reference Handler"
  - "VM Thread"
  - "GC task thread#0 (ParallelGC)"
  - "GC task thread#1 (ParallelGC)"
  - "VM Periodic Task Thread"
tokenized_threads:
  "order-dispatcher": {}                      # whole name -> t.....x.....
  "pgto-worker-1": { keeps_suffix: "-1" }  # prefix token + literal "-1"
tokenized_classes:
  - "com.acme.order.OrderDispatcher"
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.LedgerLock"            # also appears after "(a " on the lock line
  - "com.acme.payment.PaymentFacade"
  - "com.acme.payment.gateway.AcquirerClient"
  - "com.acme.web.PaymentController"
stripped_lines:
  - "JNI global references:"
  - "Heap"            # whole section (PSYoungGen/ParOldGen/Metaspace/eden/from/to) stripped
invariants:
  - intra_dump_determinism
  - blank_lines_preserved
  - lock_addresses_verbatim   # <0x00000000e1a2b3c8> etc. untouched
# Traps covered: JDK 8 frames carry no module (the parser cannot assume java.base@);
# org.apache.coyote/catalina/tomcat are allowlist required -> Tomcat frames verbatim.
