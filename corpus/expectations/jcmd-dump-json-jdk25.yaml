# jcmd <pid> Thread.dump_to_file -format=json (JDK 21+). Fixture DERIVADA DE CAPTURA REAL:
# rodou-se um processo JDK 25 com pool de plataforma, virtual threads, lock contendido e
# thread de rota, capturou-se o dump com jcmd, e trocaram-se APENAS os identificadores pelo
# namespace ficticio. O schema (chaves, tipos, aninhamento) e o do proprio dumper do JDK.
# Fecha o vazamento conhecido deste dialeto: o toString() de StructuredTaskScope no container.
formato: hotspot-json
ancoras_preservadas:
  - "\"threadDump\""
  - "\"threadContainers\""
  - "\"stack\""
  - "\"blockedOn\""
  - "\"parkBlocker\""
  - "\"monitorsOwned\""
threads_allowlist_verbatim:
  - "Reference Handler"
  - "Finalizer"
  - "Signal Dispatcher"
  - "Attach Listener"
  - "Notification Thread"
  - "Common-Cleaner"
  - "VirtualThread-unblocker"
threads_tokenizadas:
  "main": {}
  "sync-/api/orders?id=99887766": { marcador_rota: true }
classes_tokenizadas:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.payment.PaymentWorker"
  - "com.acme.payment.LedgerLock"     # em blockedOn E em monitorsOwned[].locks[]
  - "com.acme.core.util.Sleeper"
  - "com.acme.batch.LedgerScope"      # container: o vazamento que motivou o suporte
linhas_stripadas: []
invariantes:
  - determinismo_intra_dump
  - determinismo_inter_dump
  - marcador_rota_q
# Armadilhas cobertas:
# 1. O marcador da SPEC 5.9 NAO pode ser a 1a linha "# tm-anon v1" -- isso invalidaria o JSON,
#    que e a razao de ser do formato. Vai como 1a CHAVE do objeto raiz ("tmAnon"), preservando
#    a string literal para busca por substring. Desvio deliberado, registrado na SPEC.
# 2. "parent" referencia outro container pela string exata de "container": as duas tem que ser
#    reescritas igual, senao a arvore de containers fica com link pendurado.
# 3. "<root>" e estrutura, nao nome -- verbatim.
# 4. parkBlocker e OBJETO ({"object": "..."}), nao string; monitorsOwned tem "depth" NUMERICO e
#    "virtual" e BOOLEANO -- por isso o leitor JSON precisa da gramatica completa (o MiniJson do
#    vault, restrito a objeto/string/inteiro, nao serve e continua restrito de proposito).
# 5. Chave desconhecida (JDK futuro) -> valor redigido + warning, nao passa direto.
