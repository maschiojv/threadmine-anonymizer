# jcmd <pid> Thread.dump_to_file -format=json (JDK 21+). Fixture DERIVED FROM A REAL CAPTURE:
# a JDK 25 process was run with a platform pool, virtual threads, a contended lock and a
# route-named thread, the dump was captured with jcmd, and ONLY the identifiers were swapped for
# the fictitious namespace. The schema (keys, types, nesting) is the JDK dumper's own.
# Closes this dialect's known leak: StructuredTaskScope's toString() in the container.
format: hotspot-json
preserved_anchors:
  - "\"threadDump\""
  - "\"threadContainers\""
  - "\"stack\""
  - "\"blockedOn\""
  - "\"parkBlocker\""
  - "\"monitorsOwned\""
allowlisted_threads_verbatim:
  - "Reference Handler"
  - "Finalizer"
  - "Signal Dispatcher"
  - "Attach Listener"
  - "Notification Thread"
  - "Common-Cleaner"
  - "VirtualThread-unblocker"
tokenized_threads:
  "main": {}
  "sync-/api/orders?id=99887766": { route_marker: true }
tokenized_classes:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.payment.PaymentWorker"
  - "com.acme.payment.LedgerLock"     # in blockedOn AND in monitorsOwned[].locks[]
  - "com.acme.core.util.Sleeper"
  - "com.acme.batch.LedgerScope"      # container: the leak that motivated supporting this format
stripped_lines: []
invariants:
  - intra_dump_determinism
  - inter_dump_determinism
  - route_marker_q
# Traps covered:
# 1. The SPEC 5.9 marker must NOT be a first line "# tm-anon v1" -- that would invalidate the JSON,
#    which is the whole point of the format. It goes as the 1st KEY of the root object ("tmAnon"),
#    keeping the literal string searchable by substring. Deliberate deviation, recorded in the SPEC.
# 2. "parent" references another container by the exact "container" string: both have to be
#    rewritten the same way, otherwise the container tree ends up with a dangling link.
# 3. "<root>" is structure, not a name -- verbatim.
# 4. parkBlocker is an OBJECT ({"object": "..."}), not a string; monitorsOwned has a NUMERIC "depth"
#    and a BOOLEAN "virtual" -- that is why the JSON reader needs the full grammar (the vault's
#    MiniJson, limited to object/string/integer, is not enough and stays limited on purpose).
# 5. Unknown key (future JDK) -> redacted value + warning, never passed through.
