# Edge: file with the LINES in reverse order (JNI refs first, "Full thread dump" on the
# last line) - happens with collection tools that stack logs. ThreadMine accepts it
# (the parser's real-hotspot-jstack.txt fixture looks like this); tm-anon must mask line by line
# WITHOUT reordering and WITHOUT relying on "header before body".
format: hotspot-jstack
preserved_anchors:
  - "Full thread dump OpenJDK 64-Bit Server VM (21.0.3+9-LTS mixed mode, sharing):"
  - "java.lang.Thread.State:"
allowlisted_threads_verbatim:
  - "Reference Handler"
  - "http-nio-8080-exec-1"
tokenized_threads:
  "main": {}   # fixed after checking against the real allowlist: the real allowlist-v1 has no rule for "main" -> tokenized
  "pgto-worker-1": { keeps_suffix: "-1" }
tokenized_classes:
  - "com.acme.web.PaymentController"
  - "com.acme.payment.PaymentFacade"
  - "com.acme.payment.LedgerLock"
  - "com.acme.payment.LedgerService"
  - "com.acme.gateway.Bootstrap"
stripped_lines:
  - "JNI global refs"
invariants:
  - line_order_preserved     # output in the SAME (reversed) order as the input
  - intra_dump_determinism
  - blank_lines_preserved
  - lock_addresses_verbatim
# Pitfall covered: the "Full thread dump" anchor falls OUTSIDE the first 4KB only in large
# dumps; here it is on the last line of a small file (within the 4KB) - format detection
# must not require it to be the first non-blank line. Frames show up BEFORE their thread's
# header: the lexer classifies each line by its own shape, not by its position.
