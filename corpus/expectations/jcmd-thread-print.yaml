# jcmd <pid> Thread.print: identical to jstack EXCEPT for the 1st line "48350:" (pid + colon)
# before the timestamp - format detection has to tolerate that preamble in the first 4KB.
format: hotspot-jstack
preserved_anchors:
  - "48350:"                        # jcmd preamble preserved (not an identifier)
  - "Full thread dump OpenJDK 64-Bit Server VM (17.0.8+7-LTS mixed mode, sharing):"
  - "java.lang.Thread.State:"
allowlisted_threads_verbatim:
  - "Reference Handler"
  - "Monitor Deflation Thread"
  - "VM Thread"
  - "GC Thread#0"
  - "VM Periodic Task Thread"
tokenized_threads:
  "main": {}   # fixed after checking against the real allowlist: the real allowlist-v1 has no rule for "main" -> tokenized
  "report-render-1": { keeps_suffix: "-1" }
  "report-render-2": { keeps_suffix: "-2" }
tokenized_classes:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.report.PdfRenderer"
  - "com.acme.report.ReportJob"
stripped_lines:
  - "Threads class SMR info:"
  - "_java_thread_list"
  - "JNI global refs"
invariants:
  - intra_dump_determinism
  - blank_lines_preserved
# Trap covered: the "48350:" line matches no frame/thread rule - fail-closed must NOT
# redact it (it is jcmd's standard preamble; it needs its own preservation rule).
