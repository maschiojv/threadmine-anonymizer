# jcmd <pid> Thread.print: identico ao jstack EXCETO a 1a linha "48350:" (pid + dois-pontos)
# antes do timestamp - o detector de formato precisa tolerar esse preambulo nos primeiros 4KB.
formato: hotspot-jstack
ancoras_preservadas:
  - "48350:"                        # preambulo do jcmd preservado (nao e identificador)
  - "Full thread dump OpenJDK 64-Bit Server VM (17.0.8+7-LTS mixed mode, sharing):"
  - "java.lang.Thread.State:"
threads_allowlist_verbatim:
  - "main"
  - "Reference Handler"
  - "Monitor Deflation Thread"
  - "VM Thread"
  - "GC Thread#0"
  - "VM Periodic Task Thread"
threads_tokenizadas:
  "report-render-1": { preserva_sufixo: "-1" }
  "report-render-2": { preserva_sufixo: "-2" }
classes_tokenizadas:
  - "com.acme.gateway.Bootstrap"
  - "com.acme.report.PdfRenderer"
  - "com.acme.report.ReportJob"
linhas_stripadas:
  - "Threads class SMR info:"
  - "_java_thread_list"
  - "JNI global refs"
invariantes:
  - determinismo_intra_dump
  - blank_lines_preservadas
# Armadilha coberta: a linha "48350:" nao casa nenhuma regra de frame/thread - fail-closed NAO
# pode redigi-la (e o preambulo padrao do jcmd; precisa de regra propria de preservacao).
