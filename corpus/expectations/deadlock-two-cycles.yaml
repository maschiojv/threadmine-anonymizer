# Deadlock with 2 SIMULTANEOUS cycles: two "Found one Java-level deadlock:" blocks (one per cycle,
# each with its own "Java stack information" section) and a "Found 2 deadlocks." footer (plural).
format: hotspot-jstack
preserved_anchors:
  - "Full thread dump OpenJDK 64-Bit Server VM (21.0.3+9-LTS mixed mode, sharing):"
  - "java.lang.Thread.State:"
  - "Found one Java-level deadlock:"     # occurs 2x - both preserved
  - "Java stack information for the threads listed above:"
  - "Found 2 deadlocks."
allowlisted_threads_verbatim:
  - "VM Thread"
  - "GC Thread#0"
  - "VM Periodic Task Thread"
tokenized_threads:
  "main": {}   # fixed after checking against the real allowlist: the real allowlist-v1 has no rule for "main" -> tokenized
  "pgto-worker-1": { keeps_suffix: "-1" }
  "pgto-worker-2": { keeps_suffix: "-2" }
  "billing-sched-1": { keeps_suffix: "-1" }
  "report-render-1": { keeps_suffix: "-1" }
tokenized_classes:
  - "com.acme.payment.LedgerService"
  - "com.acme.payment.LedgerLock"
  - "com.acme.payment.PaymentFacade"
  - "com.acme.stock.StockLatch"
  - "com.acme.stock.StockSync"
  - "com.acme.order.OrderService"
  - "com.acme.billing.InvoiceService"
  - "com.acme.billing.TariffTable"
  - "com.acme.billing.sched.TariffJob"
  - "com.acme.report.RenderGate"
  - "com.acme.report.PdfRenderer"
  - "com.acme.report.ReportJob"
stripped_lines:
  - "JNI global refs"
invariants:
  - intra_dump_determinism
  - deadlock_names_consistent
  - blank_lines_preserved
  - lock_addresses_verbatim
# Traps covered: two independent cycles - the rewrite must not mix assignments
# across blocks; "billing-sched-1" and "report-render-1" both end in "-1" but have different
# prefixes => different base tokens, same literal suffix; the plural footer ("Found 2
# deadlocks.") differs from the singular one and must be recognized as an anchor, not redacted.
